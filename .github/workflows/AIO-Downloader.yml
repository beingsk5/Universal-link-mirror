name: AIO Downloader & Auto Release

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Paste download links (one per line)"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip p7zip-full bc curl iputils-ping

      - name: Save input links
        run: |
          printf "%s\n" "${{ github.event.inputs.links }}" > links.txt
          sed -i '/^[[:space:]]*$/d' links.txt
          echo "Links:"
          cat links.txt

      - name: Detect SourceForge links
        id: detect
        run: |
          if grep -qi "sourceforge.net" links.txt; then
            echo "IS_SF=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SF=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag from file name
        id: autotag
        run: |
          FIRST_URL=$(head -n 1 links.txt)
          FILE=$(basename "$FIRST_URL" | sed 's/\?.*//')
          TAG=$(echo "$FILE" | sed 's/[^a-zA-Z0-9._-]/-/g')

          if [ -z "$TAG" ]; then
            TAG="release-$(date +%Y%m%d-%H%M%S)"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Auto tag: $TAG"

      - name: Determine Fastest SourceForge Mirror
        id: fastest
        if: steps.detect.outputs.IS_SF == 'true'
        run: |
          echo "Testing SourceForge mirrors..."

          MIRRORS=(
            "netix.dl.sourceforge.net"
            "gigenet.dl.sourceforge.net"
            "pilotfiber.dl.sourceforge.net"
            "versaweb.dl.sourceforge.net"
          )

          BEST=""
          BEST_PING=999999

          echo "Mirror Speed Test Report" > mirror_report.txt
          echo "Timestamp: $(date)" >> mirror_report.txt
          echo "" >> mirror_report.txt

          for M in "${MIRRORS[@]}"; do
            echo "Testing: $M" | tee -a mirror_report.txt

            PING=$(ping -c 3 -W 2 "$M" 2>/dev/null \
              | tail -1 | awk -F'/' '{print $5}')

            echo "Ping: ${PING:-N/A} ms" | tee -a mirror_report.txt

            if [[ "$PING" =~ ^[0-9.]+$ ]]; then
              if (( $(echo "$PING < $BEST_PING" | bc -l) )); then
                BEST="$M"
                BEST_PING="$PING"
              fi
            fi

            echo "" >> mirror_report.txt
          done

          if [ -z "$BEST" ]; then
            BEST="downloads.sourceforge.net"
          fi

          echo "Fastest Mirror: $BEST ($BEST_PING ms)" | tee -a mirror_report.txt
          echo "FAST=$BEST" >> $GITHUB_OUTPUT

      - name: Download files
        run: |
          mkdir -p downloads
          cd downloads

          IS_SF="${{ steps.detect.outputs.IS_SF }}"
          FAST="${{ steps.fastest.outputs.FAST }}"

          if [ "$IS_SF" = "true" ] && [ -z "$FAST" ]; then
            FAST="downloads.sourceforge.net"
          fi

          echo "SourceForge mode: $IS_SF"
          echo "Selected mirror: $FAST"

          while read -r url; do
            [ -z "$url" ] && continue

            FILE=$(basename "$url" | sed 's/\?.*//')
            echo "Processing: $FILE"

            FINAL_URL="$url"

            if echo "$url" | grep -qi "sourceforge.net"; then
              FINAL_URL=$(echo "$url" \
                | sed -E "s#https?://sourceforge\.net/projects/#https://$FAST/project/#")
            fi

            echo "Final URL: $FINAL_URL"

            OK=0

            for TRY in {1..5}; do
              echo "Attempt $TRY"

              rm -f "$FILE"

              aria2c \
                -x 16 -s 16 -m 5 \
                --summary-interval=0 \
                --file-allocation=trunc \
                --allow-overwrite=true \
                "$FINAL_URL" -o "$FILE" && OK=1 || OK=0

              if [ "$OK" = "1" ] && [ -s "$FILE" ]; then
                echo "✔ Valid: $FILE"
                break
              fi
            done

            if [ ! -s "$FILE" ]; then
              echo "❌ FAILED: $FILE"
              exit 1
            fi

          done < ../links.txt

      - name: Generate SHA256SUMS
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          cp downloads/* release_files/ 2>/dev/null || true
          [ -f mirror_report.txt ] && cp mirror_report.txt release_files/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.autotag.outputs.TAG }}
          name: ${{ steps.autotag.outputs.TAG }}
          body: |
            **Automatic All-Rounder Downloader**
            - Auto detects SourceForge links
            - Uses fastest mirror only for SourceForge
            - Direct download for other links
            - Run ID: ${{ github.run_id }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
