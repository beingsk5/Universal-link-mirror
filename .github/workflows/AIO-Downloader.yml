name: AIO Downloader & Auto Release

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Paste download links (one per line)"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip p7zip-full bc curl

      - name: Save input links
        run: |
          printf "%s\n" "${{ github.event.inputs.links }}" > links.txt
          sed -i '/^[[:space:]]*$/d' links.txt
          echo "Links:"
          cat links.txt

      - name: Detect SourceForge links
        id: detect
        run: |
          if grep -qi "sourceforge.net" links.txt; then
            echo "IS_SF=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SF=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag
        id: autotag
        run: |
          FIRST_URL=$(head -n 1 links.txt)
          FILE=$(basename "$FIRST_URL" | sed 's/\?.*//')
          TAG=$(echo "$FILE" | sed 's/[^a-zA-Z0-9._-]/-/g')
          [ -z "$TAG" ] && TAG="release-$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Determine Fastest SourceForge Mirror (Real Speed Test)
        id: fastest
        if: steps.detect.outputs.IS_SF == 'true'
        run: |
          echo "Testing mirrors using real download speed..."

          MIRRORS=(
            "netix.dl.sourceforge.net"
            "gigenet.dl.sourceforge.net"
            "pilotfiber.dl.sourceforge.net"
            "versaweb.dl.sourceforge.net"
            "webwerks.dl.sourceforge.net"
          )

          TEST_PATH=$(head -n 1 links.txt | sed -E 's#https?://[^/]+/(project/.*)#\1#')

          BEST=""
          BEST_SPEED=0

          echo "Mirror Speed Test Report" > mirror_report.txt
          echo "Timestamp: $(date)" >> mirror_report.txt
          echo "" >> mirror_report.txt

          for M in "${MIRRORS[@]}"; do
            URL="https://$M/$TEST_PATH"
            echo "Testing $M..." | tee -a mirror_report.txt

            SPEED=$(curl -L -o /dev/null -s -w "%{speed_download}" "$URL")

            SPEED_MB=$(echo "$SPEED / 1024 / 1024" | bc -l)
            SPEED_MB=$(printf "%.2f" "$SPEED_MB")

            echo "Speed: $SPEED_MB MB/s" | tee -a mirror_report.txt

            if (( $(echo "$SPEED > $BEST_SPEED" | bc -l) )); then
              BEST="$M"
              BEST_SPEED="$SPEED"
            fi

            echo "" >> mirror_report.txt
          done

          if [ -z "$BEST" ]; then
            BEST="downloads.sourceforge.net"
          fi

          echo "Fastest Mirror Selected: $BEST" | tee -a mirror_report.txt
          echo "FAST=$BEST" >> $GITHUB_OUTPUT

      - name: Download files (Mirror Forced + Fallback)
        run: |
          mkdir -p downloads
          cd downloads

          IS_SF="${{ steps.detect.outputs.IS_SF }}"
          FAST="${{ steps.fastest.outputs.FAST }}"

          while read -r url; do
            [ -z "$url" ] && continue

            FILE=$(basename "$url" | sed 's/\?.*//')
            echo "Processing: $FILE"

            FINAL_URL="$url"

            if echo "$url" | grep -qi "sourceforge.net"; then
              PATH_PART=$(echo "$url" | sed -E 's#https?://[^/]+/(project/.*)#\1#')
              FINAL_URL="https://$FAST/$PATH_PART"
            fi

            echo "Downloading from: $FINAL_URL"

            SUCCESS=0

            for TRY in {1..3}; do
              echo "Attempt $TRY..."
              rm -f "$FILE"

              aria2c -x16 -s16 -k1M --file-allocation=trunc \
                --allow-overwrite=true "$FINAL_URL" -o "$FILE"

              if [ -s "$FILE" ]; then
                SUCCESS=1
                break
              fi
            done

            if [ "$SUCCESS" = "0" ]; then
              echo "❌ Download failed for $FILE"
              exit 1
            fi

          done < ../links.txt

      - name: Generate SHA256SUMS
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          cp downloads/* release_files/ 2>/dev/null || true
          [ -f mirror_report.txt ] && cp mirror_report.txt release_files/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.autotag.outputs.TAG }}
          name: ${{ steps.autotag.outputs.TAG }}
          body: |
            **Automatic All-Rounder Downloader**
            - Fastest SourceForge mirror selected via real speed test
            - Mirror forced for all SourceForge links
            - SHA256SUMS included
            - Run ID: ${{ github.run_id }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
