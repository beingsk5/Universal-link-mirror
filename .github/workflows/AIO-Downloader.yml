name: AIO Downloader & Auto Release

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Paste download links (one per line)"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip p7zip-full bc curl jq

      - name: Save input links
        run: |
          printf "%s\n" "${{ github.event.inputs.links }}" > links.txt
          sed -i '/^[[:space:]]*$/d' links.txt
          echo "Links:"
          cat links.txt

      - name: Detect SourceForge links
        id: detect
        run: |
          if grep -qi "sourceforge.net" links.txt; then
            echo "IS_SF=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SF=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag
        id: autotag
        run: |
          FIRST_URL=$(head -n 1 links.txt)
          FILE=$(basename "$FIRST_URL" | sed 's/\?.*//')
          TAG=$(echo "$FILE" | sed 's/[^a-zA-Z0-9._-]/-/g')
          [ -z "$TAG" ] && TAG="release-$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Fetch All SourceForge Mirrors Dynamically
        id: mirrors
        if: steps.detect.outputs.IS_SF == 'true'
        run: |
          FIRST_URL=$(head -n 1 links.txt)

          PROJECT=$(echo "$FIRST_URL" | sed -E 's#.*sourceforge\.net/projects/([^/]+)/.*#\1#')
          FILE=$(basename "$FIRST_URL" | sed 's/\?.*//')

          echo "Project: $PROJECT"
          echo "File: $FILE"

          API_URL="https://sourceforge.net/settings/mirror_choices?projectname=$PROJECT&filename=$FILE&format=json"

          curl -s "$API_URL" > mirrors.json

          jq -r '.mirrors[].url' mirrors.json > mirror_list.txt

          echo "Fetched Mirrors:"
          cat mirror_list.txt

      - name: Test Mirrors & Sort By Speed
        id: fastest
        if: steps.detect.outputs.IS_SF == 'true'
        run: |
          FIRST_URL=$(head -n 1 links.txt)
          PATH_PART=$(echo "$FIRST_URL" | sed -E 's#https?://[^/]+/(project/.*)#\1#')

          echo "Mirror Speed Test Report" > mirror_report.txt
          echo "Timestamp: $(date)" >> mirror_report.txt
          echo "" >> mirror_report.txt

          > sorted_mirrors.txt

          while read -r MIRROR_URL; do
            HOST=$(echo "$MIRROR_URL" | sed -E 's#https?://([^/]+)/.*#\1#')
            TEST_URL="https://$HOST/$PATH_PART"

            echo "Testing $HOST..." | tee -a mirror_report.txt

            SPEED=$(curl -L --max-time 20 -o /dev/null -s -w "%{speed_download}" "$TEST_URL" || echo 0)

            if [[ ! "$SPEED" =~ ^[0-9]+$ ]]; then
              SPEED=0
            fi

            SPEED_MB=$(echo "$SPEED / 1024 / 1024" | bc -l)
            SPEED_MB=$(printf "%.2f" "$SPEED_MB")

            if [ "$SPEED" -eq 0 ]; then
              echo "Unreachable ❌" | tee -a mirror_report.txt
            else
              echo "Speed: $SPEED_MB MB/s" | tee -a mirror_report.txt
            fi

            echo "$SPEED $HOST" >> sorted_mirrors.txt
            echo "" >> mirror_report.txt

          done < mirror_list.txt

          sort -nr sorted_mirrors.txt > ranked_mirrors.txt

          echo "Ranked Mirrors:"
          cat ranked_mirrors.txt

      - name: Download Files (Auto Fastest + Auto Fallback)
        run: |
          mkdir -p downloads
          cd downloads

          IS_SF="${{ steps.detect.outputs.IS_SF }}"

          while read -r url; do
            [ -z "$url" ] && continue

            FILE=$(basename "$url" | sed 's/\?.*//')
            echo "Processing: $FILE"

            SUCCESS=0

            if echo "$url" | grep -qi "sourceforge.net"; then

              PATH_PART=$(echo "$url" | sed -E 's#https?://[^/]+/(project/.*)#\1#')

              while read -r line; do
                HOST=$(echo "$line" | awk '{print $2}')
                FINAL_URL="https://$HOST/$PATH_PART"

                echo "Trying mirror: $HOST"

                aria2c -x16 -s16 -k1M --file-allocation=trunc \
                  --allow-overwrite=true "$FINAL_URL" -o "$FILE"

                if [ -s "$FILE" ]; then
                  SUCCESS=1
                  echo "Downloaded successfully from $HOST"
                  break
                else
                  rm -f "$FILE"
                fi

              done < ../ranked_mirrors.txt

            else
              aria2c -x16 -s16 -k1M --file-allocation=trunc \
                --allow-overwrite=true "$url" -o "$FILE"

              [ -s "$FILE" ] && SUCCESS=1
            fi

            if [ "$SUCCESS" = "0" ]; then
              echo "❌ Download failed for $FILE"
              exit 1
            fi

          done < ../links.txt

      - name: Generate SHA256SUMS
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          cp downloads/* release_files/ 2>/dev/null || true
          [ -f mirror_report.txt ] && cp mirror_report.txt release_files/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.autotag.outputs.TAG }}
          name: ${{ steps.autotag.outputs.TAG }}
          body: |
            **Dynamic SourceForge Mirror Engine**
            - Mirrors fetched live from SF API
            - Real speed test ranking
            - Auto fallback if fastest fails
            - SHA256SUMS included
            - Run ID: ${{ github.run_id }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
